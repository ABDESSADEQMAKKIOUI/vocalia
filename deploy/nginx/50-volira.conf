# Volira — https://volira.cfpss.ma
#
# Mounted into the safm-demo nginx container, which owns ports 80 and 443 on
# this host. The filename matters: bootstrap.sh removes `tenant-*.conf` on every
# boot and rewrites `default.conf`, so anything named otherwise survives. It also
# renders a vhost only for certificates whose name ends in `.$ROOT_DOMAIN`
# (facturation.cfpss.ma), so volira.cfpss.ma never collides with a generated one.
#
# NO `listen 80` BLOCK ON PURPOSE. safm.conf.template already owns port 80 with a
# default_server that answers /.well-known/acme-challenge/ for every host and
# redirects the rest to https — that is what makes HTTP-01 issuance and renewal
# work for this host too.
#
# WHY /api/v1/ BYPASSES THE UI. The Next.js app ships a proxy route at
# ui/src/app/api/v1/[...path], but a route handler strips the hop-by-hop
# `upgrade` header, so WebSockets die there. Voice (webrtc signaling, telephony,
# agent streams) needs them, so nginx proxies /api/v1/ straight to the backend.

# conf.d/*.conf is included inside the http block, which is the only context a
# map may live in. The safm config defines no $connection_upgrade of its own, so
# this is the sole definition; a duplicate would be a hard config error, hence
# the grep before adding it.
# UPSTREAMS ARE RESOLVED PER REQUEST, NOT AT CONFIG LOAD.
# A literal `proxy_pass http://volira-api:8000` makes nginx resolve the name
# while parsing the configuration: if the volira stack is down or not yet
# started, nginx REFUSES TO BOOT — and this nginx also serves
# facturation.cfpss.ma. Going through a variable defers resolution to request
# time via docker's embedded DNS, so a stopped volira yields a 502 on its own
# vhost instead of taking the whole edge down with it.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# app.volira.cfpss.ma — la plateforme.
# Le domaine nu passe a la page commerciale ; l'application vit desormais ici.
# Les deux blocs partagent la map et le resolver declares plus haut : les
# redeclarer serait une erreur de configuration, pas un doublon inoffensif.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.volira.cfpss.ma;

    ssl_certificate     /etc/letsencrypt/live/app.volira.cfpss.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.volira.cfpss.ma/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Campaign CSVs and knowledge-base documents.
    client_max_body_size 64m;

    # Next.js advertises itself on every page it renders. Version-less, but it
    # still narrows an attacker's search space for free.
    proxy_hide_header X-Powered-By;

    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # Renewals answer over port 80, but keep this so an http->https quirk can
    # never lock certbot out of an existing certificate.
    # The interactive docs are already disabled in the app, but the raw schema
    # still described all 165 routes, platform-admin included. Nothing fetches it
    # at runtime — the typed client is generated at build time — so it is closed
    # here rather than handed to whoever asks. 404, not 403: matching the docs
    # response says "not here" instead of "here, but forbidden".
    location = /api/v1/openapi.json {
        return 404;
    }

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Backend. add_header does not merge across levels in nginx: a block that
    # declares any add_header loses every inherited one, so each location below
    # repeats the full set rather than relying on a server-level default.
    location ^~ /api/v1/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

        set $volira_api volira-api:8000;
        proxy_pass http://$volira_api;
        proxy_http_version 1.1;

        # WebSocket upgrade — voice signalling and telephony media.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # A voice call holds its socket open for the whole conversation.
        proxy_connect_timeout 10s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;

        # Agent streams are server-sent events; buffering would batch them.
        proxy_buffering off;
        proxy_redirect off;
    }

    # Embeddable voice widget. Deliberately NO X-Frame-Options: this path exists
    # to be loaded from a customer's own site. Everything else stays SAMEORIGIN.
    location ^~ /embed {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        # The widget is the microphone: it must keep it, here and when this page
        # is nested in a customer's site. Everything else stays off.
        add_header Permissions-Policy "microphone=*, camera=(), geolocation=(), payment=(), usb=()" always;
        # No frame-ancestors on purpose — this path exists to be embedded.
        add_header Content-Security-Policy "base-uri 'self'; object-src 'none'" always;

        set $volira_ui volira-ui:3010;
        proxy_pass http://$volira_ui;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_redirect off;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=()" always;
        # Deliberately NOT a script-src policy: Next.js hydrates with inline
        # scripts, so a strict script-src needs per-request nonces and a test
        # pass. These three directives block real attacks (base-tag hijacking,
        # plugin injection, clickjacking) with no risk of breaking the app.
        add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;

        set $volira_ui volira-ui:3010;
        proxy_pass http://$volira_ui;
        proxy_http_version 1.1;

        # Next.js dev/HMR and any client upgrade.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering off;
        proxy_redirect off;
    }
}


# ---------------------------------------------------------------------------
# volira.cfpss.ma — la page commerciale.
#
# Le domaine nu appartient desormais aux prospects : c'est la premiere chose
# qu'un visiteur voit. L'application a demenage sur app.volira.cfpss.ma, et les
# anciens chemins y sont rediriges de facon permanente pour que les liens deja
# partages continuent de fonctionner.
#
# La landing vit dans son propre projet compose (/opt/volira-landing), sans rien
# partager avec la plateforme : elle doit rester debout meme si l'application
# est arretee pour maintenance.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name volira.cfpss.ma;

    ssl_certificate     /etc/letsencrypt/live/volira.cfpss.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/volira.cfpss.ma/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;

    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Les liens deja partages vers l'application ne doivent pas tomber sur la
    # page commerciale : 301 vers le nouveau domaine, chemin et requete conserves.
    location ~ ^/(auth|platform-admin|workflow|campaigns|whatsapp|overview|settings|billing|usage|api-keys|reports|recordings|files|tools|automation|superadmin|model-configurations|telephony-configurations|handler|impersonate|after-sign-in)(/|$) {
        return 301 https://app.volira.cfpss.ma$request_uri;
    }
    location ^~ /embed  { return 301 https://app.volira.cfpss.ma$request_uri; }
    location ^~ /api/v1 { return 301 https://app.volira.cfpss.ma$request_uri; }

    # Le formulaire de demande de demonstration.
    location = /api/demo-request {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        set $volira_demo volira-landing-demo:8080;
        proxy_pass http://$volira_demo;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout    20s;
        proxy_buffering off;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        # La page ne charge que ses propres fichiers : aucune requete externe,
        # donc la politique peut etre stricte sans rien casser.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;

        set $volira_landing volira-landing-site:80;
        proxy_pass http://$volira_landing;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_redirect off;
    }
}
